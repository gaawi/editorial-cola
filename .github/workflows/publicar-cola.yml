# Publica en Instagram y Facebook lo que toca de datos/programado.json.
#
# GitHub no cumple el «cada 10 minutos»: en un repositorio con poco
# movimiento lo arranca cada cuatro o seis horas (el 10-11 nov, siete veces en
# día y medio). Por eso cada arranque se queda despierto casi seis horas
# mirando la cola cada minuto: el siguiente arranque llega antes de que este
# acabe y espera en fila, así que siempre hay uno vigilando. El repositorio es
# público, así que estos minutos no cuestan.
name: Publicar cola

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Nunca dos a la vez: dos ejecuciones solapadas podrían publicar lo mismo.
concurrency:
  group: publicar-cola
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar lo que toca
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git config user.name "editorial-cola"
          git config user.email "editorial-cola@users.noreply.github.com"
          # Al lanzarlo a mano, primero comprueba que los secretos sirven.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then node herramientas/publicar-cola.mjs --comprobar; fi
          fin=$(( $(date +%s) + 345*60 ))
          while :; do
            git pull -q --rebase origin main || true
            node herramientas/publicar-cola.mjs || echo "Esta vuelta falló; sigue la siguiente."
            [ "$(date +%s)" -ge "$fin" ] && break
            sleep 60
          done
