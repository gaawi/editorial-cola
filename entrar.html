<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marble</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marble">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* Los estilos van aquí dentro: estilo.css está detrás de la puerta y la
     puerta no puede depender de lo que hay al otro lado. */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --papel: #faf9f8; --tinta: #1c1917; --suave: #57534e; --filete: #e7e5e4; --no: #b91c1c; }
  html, body { background: var(--papel); color: var(--tinta);
    font-family: Archivo, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .btn { min-height: 48px; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 600;
    border: 1px solid; cursor: pointer; }
  body { display: grid; place-items: center; min-height: 100svh; padding: 24px; }
  .puerta { text-align: center; max-width: 320px; }
  .puerta h1 { font-family: Literata, Georgia, serif; font-size: 24px; margin-bottom: 8px; }
  .puerta p { color: var(--suave); font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
  .puerta .btn { width: 100%; background: #1c1917; border-color: #1c1917; color: #fff; }
  .puerta .mal { color: var(--no); font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<div class="puerta">
  <img src="/iconos/icono-192.png" alt="" width="88" height="88" style="border-radius:20px;margin-bottom:16px">
  <h1>Marble</h1>
  <p>Los borradores no son públicos. Entra con la cuenta de GitHub que puede escribir en el repositorio.</p>
  <button id="entrar" class="btn">Entrar con GitHub</button>
  <p class="mal" id="mal" hidden></p>
</div>
<script>
// En la misma página, sin ventana emergente: en la app instalada del iPhone
// una ventana aparte se abre en Safari y la sesión no llegaría a la app.
document.getElementById('entrar').addEventListener('click', function () {
  this.disabled = true; this.textContent = 'Abriendo GitHub…';
  location.href = '/api/auth';
});
function fallo(t) { var e = document.getElementById('mal'); e.textContent = t; e.hidden = false; }
var err = new URLSearchParams(location.search).get('error');
if (err !== null) fallo(err || 'GitHub no dio permiso.');
</script>
</body>
</html>
