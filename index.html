<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Aprobar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Alegreya+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="barra">
  <button id="atras" class="atras" hidden aria-label="Volver">‹</button>
  <h1 id="titulo">Aprobar</h1>
  <button id="marca" class="marca">CreArtBox</button>
</header>

<!-- ── Lista ─────────────────────────────────────────────────────────── -->
<main id="lista" class="pantalla activa">
  <p class="entrar-aviso" id="entrar-aviso" hidden>Para que los botones guarden,
    <a href="/entrar.html">entra otra vez con GitHub</a>. Solo una vez en cada aparato.</p>
  <nav class="pestanas" id="pestanas">
    <button class="pest activo" data-vista="ideas">Ideas</button>
    <button class="pest" data-vista="confirmar">Confirmar<span class="cuenta-pest" id="cuenta-confirmar"></span></button>
    <button class="pest" data-vista="programado">Programado</button>
    <button class="pest" data-vista="publicado">Publicado</button>
    <button class="pest" data-vista="calendario">Calendario</button>
  </nav>

  <div id="vista-ideas">
    <nav class="filtros" id="filtros">
      <button class="chip activo" data-filtro="ahora">Todas las ideas</button>
      <button class="chip" data-filtro="archivo">Archivo</button>
    </nav>
    <div class="idea-nueva" id="idea-nueva">
      <form class="sugerir-form" id="idea-form">
        <textarea rows="1" placeholder="Sugerir una idea nueva…"></textarea>
        <button type="submit">Enviar</button>
      </form>
      <ul id="ideas-pedidas"></ul>
    </div>
    <nav class="historias" id="historias"></nav>
    <div id="fichas" class="muro"></div>
    <p id="vacio" class="vacio" hidden>Nada por aquí.</p>
  </div>

  <div id="vista-confirmar" hidden>
    <p class="aviso-suave" id="resumen-confirmar"></p>
    <nav class="historias" id="historias-conf"></nav>
    <div id="fichas-conf" class="muro"></div>
  </div>

  <div id="vista-programado" hidden>
    <p class="aviso-suave" id="resumen-programado"></p>
    <nav class="historias" id="historias-prog"></nav>
    <div id="fichas-prog" class="muro"></div>
  </div>

  <div id="vista-calendario" hidden>
    <div class="cal-cab">
      <button id="cal-ant" aria-label="Mes anterior">‹</button>
      <h2 id="cal-titulo"></h2>
      <button id="cal-sig" aria-label="Mes siguiente">›</button>
      <button id="cal-hoy" class="cal-hoy">Hoy</button>
    </div>
    <div class="cal-semana"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div id="cal-rejilla" class="cal-rejilla"></div>
    <p class="cal-leyenda">
      <span><i class="cal-marca post publicado"></i>publicado</span>
      <span><i class="cal-marca post programado"></i>en cola</span>
      <span><i class="cal-marca post idea"></i>idea</span>
      <span><i class="cal-marca historia publicado"></i>historia</span>
      <span><i class="cal-barra"></i>concierto</span>
    </p>
    <section id="cal-dia" class="cal-dia"></section>
  </div>

  <div id="vista-publicado" hidden>
    <p class="aviso-suave" id="resumen-publicado"></p>
    <nav class="historias" id="historias-pub"></nav>
    <div id="fichas-pub" class="muro"></div>
    <div id="rejilla" class="rejilla"></div>
  </div>
</main>

<!-- ── Una ficha ─────────────────────────────────────────────────────── -->
<main id="detalle" class="pantalla">
  <nav class="redes" id="redes">
    <button class="red activo" data-red="ig">Instagram</button>
    <button class="red" data-red="fb">Facebook</button>
    <button class="red" data-red="story">Historia</button>
  </nav>

  <div id="escenario" class="escenario"></div>

  <section class="decidir">
    <div class="estado-actual" id="estado-actual"></div>
    <div class="acciones-flujo" id="acciones-detalle"></div>
    <div class="programar" id="programar"></div>
    <p class="aviso-suave">Los comentarios van por el chat.</p>
  </section>
</main>

<!-- Ficha publicada, al tocar la rejilla -->
<div id="hoja" class="hoja" hidden>
  <div class="hoja-caja">
    <button class="hoja-cerrar" id="hoja-cerrar" aria-label="Cerrar">×</button>
    <img id="hoja-img" alt="">
    <div class="hoja-datos" id="hoja-datos"></div>
  </div>
</div>

<!-- Una historia a pantalla completa, al tocar un circulito -->
<div id="visor" class="visor" hidden>
  <button class="visor-cerrar" id="visor-cerrar" aria-label="Cerrar">×</button>
  <div class="visor-hueco" id="visor-hueco"></div>
  <div class="visor-pie" id="visor-pie"></div>
</div>

<!-- Editar un post: textos, hora y fotos -->
<div id="editor" class="pide" hidden>
  <form class="pide-caja editor-caja" id="editor-form">
    <h3 id="editor-titulo">Editar</h3>
    <p id="editor-ayuda"></p>
    <div id="editor-campos">
      <label class="campo" id="campo-texto">Texto<textarea id="ed-texto" rows="9"></textarea></label>
      <label class="campo" id="campo-ig">Instagram<textarea id="ed-ig" rows="7"></textarea></label>
      <label class="campo" id="campo-fb">Facebook<textarea id="ed-fb" rows="7"></textarea></label>
      <label class="campo" id="campo-cuando">Cuándo sale (hora de Nueva York)<input type="datetime-local" id="ed-cuando"></label>
      <div class="campo">Fotos
        <div class="ed-fotos" id="ed-fotos"></div>
        <label class="btn btn-no ed-subir">Subir fotos<input type="file" id="ed-archivo" accept="image/*" multiple hidden></label>
        <div class="ed-url"><input type="url" id="ed-url" placeholder="o pega la dirección de una foto (https://…)"><button type="button" class="btn btn-no" id="ed-url-ok">Añadir</button></div>
        <div class="ed-modo" id="ed-modo">
          <label><input type="radio" name="modo" value="fondo" checked> De fondo del diseño</label>
          <label><input type="radio" name="modo" value="fotos"> Tal cual, sin diseño</label>
        </div>
      </div>
    </div>
    <label class="campo" id="editor-nota-campo" hidden>Qué hay que cambiar<textarea id="ed-nota" rows="4"></textarea></label>
    <div class="pide-botones">
      <button type="button" class="btn btn-no" id="ed-cancelar">Cancelar</button>
      <button type="submit" class="btn btn-si" id="ed-guardar">Guardar</button>
    </div>
  </form>
</div>

<div id="aviso" class="aviso" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
