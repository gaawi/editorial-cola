<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Render</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Alegreya+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body style="margin:0;background:#111">
<!--
  Página sin interfaz: existe para que el publicador pueda dibujar las
  imágenes con el mismo motor que la vista previa. Se abre sin que nadie la
  vea, se le piden las diapositivas y se cierra.

  El kit de ADAR no sirve para esto: no tiene formato 4:5 ni permite elegir
  el estilo desde fuera, y las dos cosas hacen falta ahora.
-->
<script type="module">
import { crearMotor, TAMANOS } from './motor.js';

const datos = await (await fetch('datos/posts.json')).json();
const motores = {};

window.cuantas = (marca, clave) => {
  const p = datos.marcas[marca].posts.find((x) => x.clave === clave);
  return p ? p.slides.length : 0;
};

/** Dibuja una diapositiva y la devuelve como JPEG en base64. */
window.dibujarSlide = async (marca, clave, idx, fmt, estilo, cambios) => {
  const m = datos.marcas[marca];
  const base = m.posts.find((x) => x.clave === clave);
  if (!base) throw new Error('no existe la ficha ' + clave);
  // `cambios` pisa campos de la ficha solo para esta imagen (encuadres, pruebas).
  const post = cambios ? { ...base, ...cambios } : base;
  motores[marca] = motores[marca] || crearMotor(m.marca);
  const c = document.createElement('canvas');
  await motores[marca].dibujar(
    c, post, post.slides[idx], idx, post.slides.length,
    fmt, estilo || post.estilo || 'cinta'
  );
  return c.toDataURL('image/jpeg', 0.92).split(',')[1];
};

window.listo = true;
</script>
</body>
</html>
